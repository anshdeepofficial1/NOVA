name: Refresh dependency lockfiles

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-lockfiles.yml"
      - "package.json"
      - "apps/shell/package.json"
      - "Cargo.toml"
      - "crates/**/Cargo.toml"
      - "apps/shell/src-tauri/Cargo.toml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nova-dependency-lockfiles
  cancel-in-progress: false

jobs:
  refresh:
    name: Resolve and commit reproducible dependency lockfiles
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate npm workspace lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Generate root Rust workspace lockfile
        run: cargo generate-lockfile --manifest-path Cargo.toml
      - name: Generate native Tauri crate lockfile
        run: cargo generate-lockfile --manifest-path apps/shell/src-tauri/Cargo.toml
      - name: Validate dependency graphs against generated lockfiles
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/nova-workspace-metadata.json"
          cargo metadata --locked --manifest-path apps/shell/src-tauri/Cargo.toml --format-version 1 > "$RUNNER_TEMP/nova-tauri-metadata.json"
      - name: Commit lockfiles when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json Cargo.lock apps/shell/src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "Dependency lockfiles are already current."
            exit 0
          fi
          git commit -m "build: commit resolved dependency lockfiles"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
