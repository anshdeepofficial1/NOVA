name: Build NOVA ISO

on:
  push:
    branches: [main]
    paths:
      - "os/debian-live/**"
      - "scripts/validate-live-build-config.sh"
      - "scripts/validate-iso.sh"
      - "scripts/smoke-iso-qemu.sh"
      - ".github/workflows/build-iso.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-iso-build
  cancel-in-progress: false

jobs:
  build-image:
    name: Build and boot-test NOVA live installer (amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Install native desktop and QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            qemu-system-x86 qemu-utils ovmf

      - name: Verify Rust source
        run: |
          cargo fmt --all -- --check
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Install JavaScript dependencies
        run: npm install

      - name: Build and verify the native NOVA desktop package
        run: |
          npm run typecheck
          npm run build
          npm run desktop:build
          test -n "$(find apps/shell/src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)"

      - name: Build NOVA host daemon
        run: cargo build --release -p nova-daemon

      - name: Stage NOVA components into Debian live-build
        run: |
          install -D -m 0755 target/release/nova-daemon \
            os/debian-live/config/includes.chroot/usr/local/bin/nova-daemon
          mkdir -p os/debian-live/config/packages.chroot
          find apps/shell/src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -exec cp {} os/debian-live/config/packages.chroot/ \;
          test -s os/debian-live/config/includes.chroot/usr/local/bin/nova-daemon
          test -n "$(find os/debian-live/config/packages.chroot -maxdepth 1 -name '*.deb' -print -quit)"

      - name: Build NOVA ISO using Debian Trixie live-build
        run: |
          docker run --rm --privileged \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            debian:trixie \
            bash -euc '
              apt-get update
              apt-get install -y --no-install-recommends \
                bash ca-certificates file git \
                live-build debootstrap squashfs-tools xorriso \
                grub-pc-bin grub-efi-amd64-bin mtools dosfstools \
                isolinux syslinux-common debian-archive-keyring
              bash os/debian-live/build.sh
            '

      - name: Boot-test both BIOS and UEFI paths in disposable QEMU guests
        run: |
          sudo bash scripts/smoke-iso-qemu.sh \
            --iso os/debian-live/live-image-amd64.hybrid.iso \
            --firmware both \
            --timeout-seconds 600 \
            --log-dir os/debian-live/validation/qemu

      - name: Upload ISO, checksum, build manifest and test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: NOVA-OS-amd64-experimental
          path: |
            os/debian-live/live-image-amd64.hybrid.iso
            os/debian-live/live-image-amd64.hybrid.iso.sha256
            os/debian-live/live-image-amd64.hybrid.iso.buildinfo
            os/debian-live/build.log
            os/debian-live/nova-live-build-config.txt
            os/debian-live/validation/
          if-no-files-found: warn
          retention-days: 14
