# NOVA live-build GRUB configuration.
# Keep a visible boot menu while allowing headless UEFI/BIOS diagnostics.
if [ x$feature_default_font_path = xy ] ; then
    font=unicode
else
    font=$prefix/unicode.pf2
fi

# Preserve the native graphics console for normal users.
if loadfont $font ; then
    set gfxmode=800x600
    set gfxpayload=keep
    insmod efi_gop
    insmod efi_uga
    insmod video_bochs
    insmod video_cirrus
else
    set gfxmode=auto
    insmod all_video
fi

insmod gfxterm
insmod png
source /boot/grub/theme.cfg

# Keep the native display terminal active, then mirror it to COM1.
terminal_output gfxterm

# Mirror GRUB output to COM1 without removing the graphical console.
# The live kernel also receives console=ttyS0,115200n8 from auto/config.
insmod serial
serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_input --append serial
terminal_output --append serial

insmod play
play 960 440 1 0 4 440 1

# Apply boot policy after loading the Debian theme so it cannot override it.
set default=0
set timeout=8
set timeout_style=menu
