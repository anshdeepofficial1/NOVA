name: NOVA CI

on:
  push:
    branches: [main, "work/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust and live-build configuration checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check shell script syntax and QEMU harness behavior
        run: |
          bash -n scripts/check-host.sh
          bash -n scripts/stage-sidecar.sh
          bash -n scripts/test-iso-qemu.sh
          bash -n scripts/validate-live-build-config.sh
          bash -n scripts/validate-iso.sh
          bash -n scripts/smoke-iso-qemu.sh
          bash -n scripts/test-smoke-iso-qemu.sh
          bash -n scripts/smoke-desktop-sidecar.sh
          bash -n os/debian-live/build.sh
          bash -n os/debian-live/auto/build
          sh -n os/debian-live/auto/config
          sh -n os/debian-live/auto/clean
          bash scripts/test-smoke-iso-qemu.sh
      - name: Validate Debian Live configuration using Debian Trixie live-build
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /tmp \
            debian:trixie \
            bash -euc '
              apt-get update
              apt-get install -y --no-install-recommends bash live-build grub-common
              bash /workspace/scripts/validate-live-build-config.sh
            '
      - name: Verify committed Rust dependency locks
        run: |
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/nova-workspace-metadata.json"
          cargo metadata --locked --manifest-path apps/shell/src-tauri/Cargo.toml --format-version 1 > "$RUNNER_TEMP/nova-tauri-metadata.json"
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build and smoke-test the NOVA host API
        run: |
          cargo build --release -p nova-daemon --locked
          set -euo pipefail
          ./target/release/nova-daemon > "$RUNNER_TEMP/nova-daemon.log" 2>&1 &
          daemon_pid=$!
          cleanup() {
            kill "$daemon_pid" 2>/dev/null || true
            wait "$daemon_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          health_file="$RUNNER_TEMP/nova-health.json"
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:47820/health -o "$health_file"; then
              break
            fi
            sleep 0.2
          done
          grep -q '"service":"nova-daemon"' "$health_file"

          curl -fsS http://127.0.0.1:47820/api/system -o "$RUNNER_TEMP/nova-system.json"
          grep -q '"host_os":"linux"' "$RUNNER_TEMP/nova-system.json"

          route_status="$(curl -sS -o "$RUNNER_TEMP/nova-route.json" -w "%{http_code}" \
            -X POST http://127.0.0.1:47820/api/compatibility/inspect \
            -H 'Content-Type: application/json' \
            -d '{"path":"example.apk"}')"
          test "$route_status" = "200"
          grep -q '"runtime":"android_container"' "$RUNNER_TEMP/nova-route.json"
          grep -q '"execution_started":false' "$RUNNER_TEMP/nova-route.json"

          unsupported_status="$(curl -sS -o "$RUNNER_TEMP/nova-unsupported.json" -w "%{http_code}" \
            -X POST http://127.0.0.1:47820/api/compatibility/inspect \
            -H 'Content-Type: application/json' \
            -d '{"path":"example.unknown"}')"
          test "$unsupported_status" = "415"

          malformed_status="$(curl -sS -o "$RUNNER_TEMP/nova-malformed.json" -w "%{http_code}" \
            -X POST http://127.0.0.1:47820/api/compatibility/inspect \
            -H 'Content-Type: application/json' \
            -d '{"path":')"
          test "$malformed_status" = "400"

          python3 -c 'import json; print(json.dumps({"path": "x" * 9000}))' > "$RUNNER_TEMP/nova-oversized.json"
          oversized_status="$(curl -sS -o "$RUNNER_TEMP/nova-oversized-response.json" -w "%{http_code}" \
            -X POST http://127.0.0.1:47820/api/compatibility/inspect \
            -H 'Content-Type: application/json' \
            --data-binary @"$RUNNER_TEMP/nova-oversized.json")"
          test "$oversized_status" = "413"

  shell:
    name: Shell and native desktop checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xvfb dbus-daemon
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Build the native Linux desktop package
        run: npm run desktop:build
      - name: Verify Debian package contents and bundled daemon
        run: |
          package="$(find apps/shell/src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$package"
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package" | tee "$RUNNER_TEMP/nova-deb-contents.txt"
          grep -q "nova-shell" "$RUNNER_TEMP/nova-deb-contents.txt"
          grep -q "nova-daemon" "$RUNNER_TEMP/nova-deb-contents.txt"
          bash scripts/smoke-desktop-sidecar.sh "$package"
      - name: Verify native desktop Rust quality and daemon startup regressions
        run: |
          cargo metadata --locked --manifest-path apps/shell/src-tauri/Cargo.toml --format-version 1 > "$RUNNER_TEMP/nova-tauri-metadata.json"
          cargo fmt --manifest-path apps/shell/src-tauri/Cargo.toml -- --check
          cargo test --manifest-path apps/shell/src-tauri/Cargo.toml --locked
          cargo clippy --manifest-path apps/shell/src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Upload resolved dependency lockfiles for reproducibility
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nova-dependency-lockfiles
          path: |
            package-lock.json
            Cargo.lock
            apps/shell/src-tauri/Cargo.lock
          if-no-files-found: warn
          retention-days: 14
